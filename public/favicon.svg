<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Next Level Editor">
  <defs>
    <linearGradient id="nle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4392c"/>
      <stop offset="1" stop-color="#dd6a3a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#nle)"/>
  <!-- "N" for Next Level, drawn as strokes so it stays crisp at 16px. -->
  <path d="M20 45V19l24 26V19"
        fill="none" stroke="#fff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The editor caret: the site's own "writes back" motif. -->
  <rect x="47.5" y="40" width="4" height="14" rx="2" fill="#fff" opacity=".9"/>
</svg>
